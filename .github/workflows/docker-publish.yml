name: Publish Docker images

# Builds and publishes the backend/frontend images that the Docker Compose
# quick start AND the CasaOS/ZimaOS app store manifest (casaos/docker-compose.yml)
# both pull as pre-built, version-pinned images from GHCR. CasaOS installs an
# app straight from its compose file with no build step and no access to this
# repo's source, so `build:` (used in the repo-root docker-compose.yml for a
# `git clone` + build-from-source flow) is not an option there — the CasaOS
# manifest instead references `ghcr.io/raktim94/nodedr-pos-{backend,frontend}:<version>`,
# and those tags only exist because this workflow pushed them.
#
# Multi-arch (amd64 + arm64) on purpose: a real share of CasaOS/ZimaOS boxes
# are ARM SBCs, and declaring `architectures: [amd64, arm64]` in the x-casaos
# manifest without actually publishing an arm64 image would install a broken
# app on that hardware.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.0.0). Also pushed as :latest."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: nodedr-pos-backend
            context: ./backend
          - image: nodedr-pos-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image owner
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            # Fall back to the latest git tag (v1.0.0 -> 1.0.0) so a plain push
            # to master still produces a meaningfully-versioned image, not just
            # a rolling `:latest` nobody can pin to.
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '0.0.0-dev')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR image paths must be lowercase; the GitHub org/user name
          # (e.g. "Raktim94") is not guaranteed to be.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
