# NodeDR POS — runtime configuration
#
# This file is a systemd EnvironmentFile: every line must be KEY=value with no
# `export`, no shell expansion, and no inline comments after a value.
# It is a dpkg conffile, so your edits survive package upgrades.
#
# After changing anything here:   sudo systemctl restart nodedr-pos

# --- Web interface ---------------------------------------------------------
# TCP port the POS is served on. The desktop launcher and `nodedr-pos open`
# read this value, so changing it here is enough — nothing else to update.
PORT=1994

# Interface the web server binds to.
#   0.0.0.0   — reachable from other devices on the shop LAN (counter tablet,
#               a phone). This is the default; the app was designed for it.
#   127.0.0.1 — this machine only. Use on a shared/untrusted network.
HOSTNAME=0.0.0.0

# --- Backend API -----------------------------------------------------------
# The API is bound to loopback only and is never published on the LAN; the web
# interface proxies /api/* to it server-side, so the browser only ever uses the
# single port above.
#
# Do NOT change this port. Next.js resolves the proxy destination at BUILD time
# into its routes manifest, so a different port here would leave the web
# interface still calling 4000 and every request would 502. Changing it
# requires rebuilding the package with BACKEND_PORT set (see build-deb.sh).
BACKEND_PORT=4000

# Origin allowed by the API's CORS policy. Only relevant if you reach the API
# directly; normal traffic goes through the same-origin proxy above.
FRONTEND_ORIGIN=http://localhost:1994

# Set to true ONLY when serving the POS over HTTPS (e.g. behind an nginx or
# Caddy TLS terminator). Marking the session cookie Secure over plain HTTP
# makes login silently fail — the browser refuses to store the cookie.
COOKIE_SECURE=false

# --- Data ------------------------------------------------------------------
# SQLite database location. MUST be an absolute file: URL. The better-sqlite3
# driver adapter resolves relative paths against the process working directory,
# not against schema.prisma, so a relative path here would silently create the
# database somewhere other than /var/lib/nodedr-pos and appear to lose data on
# restart.
DATABASE_URL=file:/var/lib/nodedr-pos/pos.db

# Optional: pin the JWT signing secret. Leave unset and the API generates one
# on first boot and persists it to /var/lib/nodedr-pos/.jwt-secret (mode 0600),
# so sessions survive restarts and upgrades. Set it explicitly only if you need
# the same secret across several machines.
# JWT_SECRET=
