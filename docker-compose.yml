services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodedr-pos-backend
    restart: unless-stopped
    environment:
      # Absolute path — do not go back to a ".." relative path here. Prisma's
      # old built-in SQLite engine resolved relative file: URLs relative to
      # schema.prisma's directory, but the better-sqlite3 driver adapter
      # (see backend/src/lib/prisma.js) resolves them relative to process
      # cwd (/app, this container's WORKDIR). A relative "../data/pos.db"
      # silently resolved to /data/pos.db — OUTSIDE the mounted volume below
      # — so every container recreation wiped the database with no error.
      DATABASE_URL: "file:/app/data/pos.db"
      PORT: "4000"
      # Both default to the local/offline setup and need no host changes.
      # For a VPS behind real HTTPS, set FRONTEND_ORIGIN to your public
      # https:// URL and COOKIE_SECURE=true in a root .env file (copy from
      # .env.example) — never edit this file itself. Compose reads .env
      # from this directory automatically.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:1994}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    # The backend is intentionally NOT published to the host. It's reachable
    # only over the internal Docker network via the frontend's /api proxy,
    # which keeps the API off the LAN and shrinks the attack surface. To hit
    # it directly for debugging, temporarily add `ports: ["4000:4000"]`.
    expose:
      - "4000"
    # Named, Docker-managed volume — persists the SQLite database and the
    # auto-generated session secret independently of the container
    # lifecycle. Survives `docker compose down`, image rebuilds, and
    # `docker compose up --build`; only `docker compose down -v` (or
    # `docker volume rm nodedr-pos_data`) removes it. See README > Backing
    # up / resetting data.
    volumes:
      - data:/app/data
      # Direct-USB thermal printing (see backend/src/lib/escposUsb.js) needs
      # the backend to see the host's USB device nodes. Bind-mounting the
      # whole /dev/bus/usb tree (not `devices:` with a literal path, which
      # only handles device nodes that already exist at container-start —
      # USB bus/device numbers are dynamic and can renumber on reconnect)
      # keeps this working across printer unplug/replug without a restart.
      - /dev/bus/usb:/dev/bus/usb
    # Grants read/write/mknod WITHOUT full `privileged: true` on the two
    # device majors the printer needs, so the backend still can't see or touch
    # anything else on the host:
    #   189 — usbfs (/dev/bus/usb/BBB/DDD), used by the libusb transport.
    #   180 — usblp, the kernel printer driver behind /dev/usb/lp0. This is
    #         the PRIMARY transport (see backend/src/lib/escposUsb.js): the
    #         same node a working `echo > /dev/usb/lp0` writes to, and the one
    #         generic vendor-class 80mm printers only expose through the
    #         kernel. The 'm' (mknod) grant lets the backend create the lp
    #         node inside the container on demand and write straight through
    #         to the host kernel's already-bound printer — no host bind mount,
    #         so nothing fails at `compose up` when no printer is attached.
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 180:* rmw'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Where the Next.js server proxies /api/* requests. Baked into the
        # build (Next resolves rewrite destinations at build time). Points at
        # the backend service over the internal Docker network; never exposed
        # to the browser.
        BACKEND_URL: "http://backend:4000"
    container_name: nodedr-pos-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1994}:3000"
    depends_on:
      - backend

  # Optional HTTPS front door, off by default — `docker compose up` alone
  # never starts this. Only needed for camera barcode/QR scanning from a
  # phone/tablet over the LAN: browsers block getUserMedia entirely on a
  # plain http:// address that isn't localhost, with no permission prompt at
  # all. Start it with `docker compose --profile https up -d`, then open
  # https://<this-machine's-LAN-IP> on the phone/tablet instead of the usual
  # http://<ip>:1994 — see README > Camera scanning over HTTPS.
  caddy:
    image: caddy:2-alpine
    container_name: nodedr-pos-caddy
    restart: unless-stopped
    profiles:
      - https
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend

  # Alternative to the caddy service above: a Cloudflare Tunnel gets you a
  # REAL, publicly-trusted HTTPS certificate (no "this certificate isn't
  # trusted" click-through on any device, unlike caddy's self-signed one) and
  # works from anywhere, not just your LAN — at the cost of routing traffic
  # through Cloudflare's network instead of staying fully local. Two
  # separate profiles, both off by default — pick ONE:
  #
  #   docker compose --profile cloudflare-quick up -d
  # A free, anonymous "quick tunnel". No Cloudflare account needed, but the
  # public *.trycloudflare.com URL changes every time this container
  # restarts — check `docker compose logs cloudflared-quick` for the
  # current URL. Good for trying this out right now.
  #
  #   docker compose --profile cloudflare up -d
  # A named tunnel bound to your own domain, with a stable URL that
  # survives restarts. Requires a Cloudflare account with your domain
  # added, a tunnel created under Zero Trust > Networks > Tunnels with a
  # Public Hostname routed to `http://frontend:3000`, and that tunnel's
  # token set as CLOUDFLARE_TUNNEL_TOKEN in .env. Recommended for a
  # permanent shop deployment. See README > Camera scanning over HTTPS >
  # Cloudflare Tunnel.
  #
  # (cloudflared's official image is distroless — no shell inside it — so
  # this is two plain services with hardcoded commands rather than one
  # conditional shell script.)
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared-quick
    restart: unless-stopped
    profiles:
      - cloudflare-quick
    command: ["tunnel", "--url", "http://frontend:3000"]
    depends_on:
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    # Compose parses every service in this file regardless of which
    # profile is active, so a hard-required (`:?`) interpolation here would
    # break `--profile cloudflare-quick` too — default to empty and let
    # cloudflared itself report the missing token if this profile is
    # started without one set.
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      - frontend

volumes:
  data:
  caddy_data:
